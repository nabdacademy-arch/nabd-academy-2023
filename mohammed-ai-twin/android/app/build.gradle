plugins { id 'com.android.application' }

android {
  namespace 'ps.nabd.mohammedtwin'
  compileSdk 35

  defaultConfig {
    applicationId 'ps.nabd.mohammedtwin'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '1.0.0'
    buildConfigField 'String', 'TWIN_URL', '"https://nabdacademy-arch.github.io/nabd-academy-2023/mohammed-ai-twin/"'
  }
  buildFeatures { buildConfig true }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
