<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Open Doors Medicine | NABD Academy</title><style>body{margin:0;background:#071b2d;color:#eef9fc;font:16px/1.85 system-ui,Tahoma,Arial}.wrap{max-width:980px;margin:auto;padding:25px 16px}header,.card{background:#103344;border:1px solid #365c6d;border-radius:18px;padding:22px;margin:16px 0}h1,h2{line-height:1.35}a{color:#67e6cd}button,select{background:#194c59;color:white;border:1px solid #66b4b1;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffc87b}.en{direction:ltr;text-align:left}.ar{direction:rtl;text-align:right}.part{padding:12px;border-bottom:1px solid #315568}.muted{color:#bbd4dd}.quiz{background:#17424c;border-radius:12px;padding:15px;margin-top:14px}#nav{display:flex;gap:8px;flex-wrap:wrap}.card{scroll-margin-top:16px}small{color:#c9d7dc}</style><main class="wrap"><header><a href="open-doors-ai.html">← Open Doors Exam Coach</a><h1>📖 Open Doors Medicine: Biology & Chemistry</h1><p>شرح ثنائي اللغة من الأساسيات إلى التطبيق · Bilingual foundations, worked concepts and self-checks</p><p class="muted">مادة تعليمية مستقلة غير رسمية. لا تغني عن الكتب والمصادر العلمية أو تعليمات الامتحان.</p><button id="ar">العربية</button> <button id="en">English</button> <button id="both">اللغتان / Both</button><p><label for="filter">المجال / Subject</label> <select id="filter"><option value="all">All / الكل</option><option value="Biology">Biology / أحياء</option><option value="Chemistry">Chemistry / كيمياء</option></select></p><nav id="nav"></nav></header><div id="lessons"></div></main><script>const lessons=[["Biology","Cellular chemical composition","التركيب الكيميائي للخلية","Proteins are polymers of amino acids linked by peptide bonds. Primary structure is the amino-acid sequence; folding creates functional structures. Enzymes catalyze reactions by lowering activation energy.","البروتينات بوليمرات من الأحماض الأمينية ترتبط بروابط ببتيدية. البنية الأولية هي ترتيب الأحماض الأمينية، ويؤدي الطي إلى بنى وظيفية. الإنزيمات تسرّع التفاعلات بخفض طاقة التنشيط.","Carbohydrates include monosaccharides such as glucose, disaccharides such as sucrose, and polysaccharides such as glycogen, starch and cellulose. They provide energy and structural support.","تشمل الكربوهيدرات السكريات الأحادية مثل الجلوكوز، والثنائية مثل السكروز، والمتعددة مثل الجليكوجين والنشا والسليلوز. وتؤدي وظائف طاقية وبنائية.","Lipids include triglycerides, phospholipids and steroids. Phospholipids form bilayers; saturated and unsaturated fatty acids differ in their double bonds.","تشمل الدهون ثلاثيات الجليسريد والفوسفوليبيدات والستيرويدات. تكوّن الفوسفوليبيدات أغشية ثنائية الطبقة، وتختلف الأحماض الدهنية المشبعة وغير المشبعة في الروابط المزدوجة.","Which polymer is formed by peptide bonds?","أي بوليمر يتكوّن بروابط ببتيدية؟","Proteins","البروتينات"],["Biology","Energy metabolism","أيض الطاقة","Anabolism uses energy to build complex molecules; catabolism breaks molecules down and releases usable energy. ATP couples energy-releasing and energy-consuming reactions.","البناء الحيوي يستهلك الطاقة لتكوين جزيئات معقدة؛ والهدم الحيوي يفكك الجزيئات ويحرر الطاقة. يربط ATP بين التفاعلات المنتجة والمستهلكة للطاقة.","Glycolysis occurs in the cytosol, producing a net two ATP and two NADH per glucose. With oxygen, pyruvate oxidation, the citric acid cycle and oxidative phosphorylation generate most ATP.","يحدث التحلل السكري في السيتوسول وينتج صافي جزيئَي ATP وجزيئَي NADH لكل جلوكوز. وبوجود الأكسجين تنتج المراحل اللاحقة معظم ATP.","Photosynthesis captures light energy to make chemical energy; carbon fixation incorporates CO₂. Chemosynthetic organisms instead obtain energy from oxidizing inorganic substances.","يحوّل البناء الضوئي طاقة الضوء إلى طاقة كيميائية ويثبت ثاني أكسيد الكربون. أما الكائنات ذات البناء الكيميائي فتستمد الطاقة من أكسدة مواد غير عضوية.","Where does glycolysis occur?","أين يحدث التحلل السكري؟","Cytosol","السيتوسول"],["Biology","Genetics and human inheritance","الوراثة البشرية","Mendel’s segregation law states that two alleles separate into different gametes. Independent assortment applies to unlinked genes, with exceptions when genes are linked.","ينص قانون انعزال العوامل لمندل على انفصال الأليلين إلى أمشاج مختلفة. وينطبق التوزيع المستقل على الجينات غير المرتبطة، مع استثناءات للجينات المرتبطة.","Linked genes reside on the same chromosome. Crossing over between homologous chromatids during meiosis can create recombinant allele combinations; recombination frequency estimates genetic distance.","تقع الجينات المرتبطة على الكروموسوم نفسه. وقد ينتج العبور بين الكروماتيدات المتماثلة أثناء الانقسام المنصف تراكيب أليلية جديدة، ويساعد تكرار إعادة التركيب في تقدير المسافة الجينية.","Human genetics uses pedigrees, karyotyping, molecular tests and population studies. Examples of inherited conditions include cystic fibrosis and sickle-cell disease; genetic counseling supports informed decisions.","تستخدم الوراثة البشرية شجرات النسب وتحليل النمط النووي والفحوص الجزيئية والدراسات السكانية. ومن أمثلة الأمراض الموروثة التليف الكيسي وفقر الدم المنجلي، وتساعد الاستشارة الوراثية في اتخاذ قرارات مستنيرة.","What can crossing over generate?","ماذا يمكن أن ينتج العبور الوراثي؟","Recombinant chromatids","كروماتيدات معاد تركيبها"],["Biology","Microbiology and biotechnology","الأحياء الدقيقة والتقنية الحيوية","Bacteria are prokaryotes lacking a membrane-bound nucleus. Their cell walls often contain peptidoglycan; metabolism may be aerobic, anaerobic, autotrophic or heterotrophic.","البكتيريا بدائيات نوى تفتقر إلى نواة محاطة بغشاء. تحتوي جدران كثير منها على الببتيدوجليكان، وقد يكون أيضها هوائيًا أو لاهوائيًا أو ذاتيًا أو غيري التغذية.","Fungi are eukaryotes with chitin-rich walls. Yeasts are often unicellular, molds form hyphae, and some fungi cause parasitic infections. Viruses require host cells to replicate; bacteriophages infect bacteria.","الفطريات حقيقيات نوى ذات جدران غنية بالكيتين. الخمائر غالبًا وحيدة الخلية، والعفن يشكل خيوطًا فطرية، وبعض الفطريات طفيلي. تحتاج الفيروسات خلايا مضيفة للتكاثر، والعاثيات تصيب البكتيريا.","Genetic engineering modifies DNA using tools such as restriction enzymes, vectors and CRISPR systems. Transgenic organisms carry introduced genetic material; evaluate benefits, biosafety and ethics.","تعدّل الهندسة الوراثية DNA باستخدام إنزيمات القطع والنواقل وأنظمة CRISPR. تحمل الكائنات المعدلة وراثيًا مادة جينية مدخلة، ويجب تقييم المنافع والسلامة والأخلاقيات.","What do bacteriophages infect?","ما الكائنات التي تصيبها العاثيات؟","Bacteria","البكتيريا"],["Biology","Chordata and vertebrate adaptations","الحبليات وتكيف الفقاريات","Chordates share a notochord, dorsal hollow nerve cord, pharyngeal slits and post-anal tail at some life stage. Lancelets retain many of these characteristics as adults.","تشترك الحبليات في الحبل الظهري والأنبوب العصبي الظهري المجوف والشقوق البلعومية والذيل خلف الشرجي في مرحلة من حياتها. ويحتفظ السهيم بكثير منها عند البلوغ.","Fish generally use gills; amphibians undergo metamorphosis and may exchange gases through skin; reptiles have keratinized skin and amniotic eggs; birds possess feathers and efficient respiratory systems.","تتنفس الأسماك عادة بالخياشيم؛ وتخضع البرمائيات للتحول وقد تتبادل الغازات عبر الجلد؛ وتمتلك الزواحف جلدًا متقرنًا وبيضًا أمنيوسيًا؛ وللطيور ريش وجهاز تنفسي كفء.","Mammals typically have hair and mammary glands. Compare circulation, reproduction, thermoregulation and limb structures to understand environmental adaptation rather than memorizing isolated names.","تتميز الثدييات عادة بالشعر والغدد اللبنية. قارن بين الدوران والتكاثر وتنظيم الحرارة وبنية الأطراف لفهم التكيف البيئي بدل حفظ الأسماء منفصلة.","Which feature characterizes mammals?","ما السمة المميزة للثدييات؟","Mammary glands","الغدد اللبنية"],["Biology","Ecology and levels of organization","البيئة ومستويات التنظيم","Biological organization progresses from molecules to cells, tissues, organs, organisms, populations, communities, ecosystems and biosphere. A population is members of one species in a defined area.","يتدرج التنظيم الحيوي من الجزيئات إلى الخلايا والأنسجة والأعضاء والكائنات والجماعات الحيوية والمجتمعات والنظم البيئية والمحيط الحيوي. الجماعة أفراد نوع واحد في منطقة محددة.","Population size is the number of individuals; density is number per area or volume. Births and immigration increase population size, whereas deaths and emigration decrease it.","حجم الجماعة هو عدد الأفراد، والكثافة عدد الأفراد لكل وحدة مساحة أو حجم. تزيد الولادات والهجرة الوافدة العدد، وتقلله الوفيات والهجرة الخارجة.","Abiotic factors include temperature and water; biotic factors include predation and competition; anthropogenic factors arise from human activities. Energy flows through food chains, while matter cycles through ecosystems.","تشمل العوامل اللاحيوية الحرارة والماء، والحيوية الافتراس والتنافس، والبشرية آثار الأنشطة الإنسانية. تتدفق الطاقة عبر السلاسل الغذائية بينما تدور المادة في النظم البيئية.","What is population density?","ما كثافة الجماعة الحيوية؟","Individuals per unit area or volume","عدد الأفراد لكل وحدة مساحة أو حجم"],["Chemistry","Atomic structure and orbitals","التركيب الذري والأفلاك","Atomic number Z equals proton count; mass number A equals protons plus neutrons. For a neutral atom, electron count equals Z. Isotopes have equal Z but different neutron numbers.","العدد الذري Z يساوي عدد البروتونات، والعدد الكتلي A مجموع البروتونات والنيوترونات. في الذرة المتعادلة يساوي عدد الإلكترونات Z. النظائر لها العدد الذري نفسه وتختلف في النيوترونات.","Electrons occupy quantized energy levels and orbitals. The s, p, d and f subshells hold up to 2, 6, 10 and 14 electrons respectively. Follow Aufbau, Pauli exclusion and Hund’s rule when writing configurations.","تشغل الإلكترونات مستويات طاقة وأفلاكًا محددة. تستوعب المستويات الفرعية s وp وd وf بحد أقصى 2 و6 و10 و14 إلكترونًا. استخدم مبدأ البناء ومبدأ باولي وقاعدة هوند في التوزيع.","For example, sodium (Z=11) has configuration 1s² 2s² 2p⁶ 3s¹. A sodium cation Na⁺ loses its 3s electron, leaving ten electrons.","مثلًا الصوديوم Z=11 توزيعه 1s² 2s² 2p⁶ 3s¹. يفقد أيون Na⁺ إلكترون 3s ليصبح لديه عشرة إلكترونات.","How many neutrons does ²³Na (Z=11) have?","كم نيوترونًا في ²³Na وعدده الذري 11؟","12","12"],["Chemistry","Periodic table and trends","الجدول الدوري والخواص الدورية","The modern periodic law states that elemental properties recur with atomic number. Periods correspond to principal shell filling; groups often share valence-electron patterns.","ينص القانون الدوري الحديث على تكرار خواص العناصر تبعًا للعدد الذري. ترتبط الدورات بملء مستويات الطاقة، وتتشارك عناصر المجموعة غالبًا أنماط إلكترونات التكافؤ.","Across a main-group period, atomic radius generally decreases while first ionization energy and electronegativity generally increase, with known exceptions. Down a group, radius generally increases due to added shells.","عبر الدورة في العناصر الرئيسية يتناقص نصف القطر غالبًا وتزداد طاقة التأين الأولى والسالبية الكهربائية عمومًا مع وجود استثناءات. ويزداد نصف القطر نزولًا في المجموعة لإضافة أغلفة.","Effective nuclear charge and electron shielding explain these trends. Always distinguish neutral atomic radius from ionic radius and compare like species.","تفسر الشحنة النووية الفعالة والحجب الإلكتروني هذه الاتجاهات. ميّز دائمًا بين نصف قطر الذرة المتعادلة والأيون وقارن أنواعًا متشابهة.","Which generally has a larger atomic radius, Li or Na?","أي الذرتين أكبر نصف قطر عادة، Li أم Na؟","Na","Na"],["Chemistry","Metals, nonmetals and compounds","الفلزات واللافلزات ومركباتها","Alkali metals are reactive and form +1 ions; alkaline earth metals often form +2 ions. Aluminum is amphoteric; Zn, Cr, Fe and Cu show important reactions and oxidation states.","الفلزات القلوية نشطة وتكوّن أيونات +1، والقلوية الترابية غالبًا +2. الألومنيوم أمفوتيري؛ وللزنك والكروم والحديد والنحاس تفاعلات وحالات أكسدة مهمة.","Alloys combine metallic elements or metals with other elements to tailor properties. Corrosion is chemical or electrochemical deterioration; coatings, alloying and cathodic protection can reduce it.","السبائك تجمع عناصر فلزية أو فلزات مع عناصر أخرى لتحسين الخواص. التآكل تلف كيميائي أو كهروكيميائي؛ وتحد منه الطلاءات والسبك والحماية الكاثودية.","Study hydrogen, halogens, oxygen, sulfur, nitrogen, phosphorus, carbon and silicon: bonding, oxides, acids and common compounds. Allotropy means different structural forms of one element, such as diamond and graphite.","ادرس الهيدروجين والهالوجينات والأكسجين والكبريت والنيتروجين والفوسفور والكربون والسيليكون: الروابط والأكاسيد والأحماض والمركبات الشائعة. التآصل أشكال بنيوية مختلفة للعنصر نفسه مثل الألماس والجرافيت.","What is allotropy?","ما التآصل؟","Different structural forms of one element","أشكال بنيوية مختلفة للعنصر نفسه"],["Chemistry","Organic functional groups and carbohydrates","المجموعات الوظيفية العضوية والكربوهيدرات","Alcohols contain a hydroxyl group on saturated carbon; polyhydric alcohols contain several. Phenols have OH directly attached to an aromatic ring. Aldehydes and ketones contain carbonyl groups in different positions.","تحمل الكحولات مجموعة هيدروكسيل مرتبطة بكربون مشبع، وتحمل الكحولات عديدة الهيدروكسيل عدة مجموعات. في الفينول ترتبط OH مباشرة بحلقة عطرية. تحتوي الألدهيدات والكيتونات مجموعة كربونيل بموضعين مختلفين.","Carboxylic acids contain COOH; esterification joins an acid and an alcohol with water formation. Fats are typically triacylglycerols; hydrolysis and saponification are key reactions.","تحتوي الأحماض الكربوكسيلية COOH؛ ويجمع الأسترة حمضًا وكحولًا مع تكوّن ماء. الدهون عادة ثلاثيات الجليسريد؛ والتحلل المائي والتصبن تفاعلان أساسيان.","Glucose is a monosaccharide; starch and cellulose are glucose polymers with different linkages and biological functions. Learn identification reactions and functional-group transformations.","الجلوكوز سكر أحادي؛ والنشا والسليلوز بوليمران من الجلوكوز بروابط ووظائف مختلفة. تعلم تفاعلات الكشف والتحويلات بين المجموعات الوظيفية.","Which group defines carboxylic acids?","ما المجموعة التي تميز الأحماض الكربوكسيلية؟","–COOH","–COOH"],["Chemistry","Amino acids, peptides and proteins","الأحماض الأمينية والببتيدات والبروتينات","An alpha-amino acid has amino and carboxyl groups on the alpha carbon. Amino acids can behave as acids and bases, often forming zwitterions in water.","يحتوي الحمض الأميني ألفا على مجموعتي أمين وكربوكسيل على كربون ألفا. وقد يتصرف كحمض وقاعدة ويكوّن أيونًا مزدوج الشحنة في الماء.","A condensation reaction forms peptide bonds. Protein primary structure is sequence; secondary structure includes alpha helices and beta sheets; tertiary structure is the overall three-dimensional fold.","تكوّن تفاعلات التكاثف روابط ببتيدية. البنية الأولية هي التسلسل، والثانوية تشمل حلزون ألفا وصفائح بيتا، والثالثية هي الطي ثلاثي الأبعاد.","Hydrolysis breaks peptide bonds. Denaturation disrupts higher-order folding, often without breaking the primary sequence. Biuret and ninhydrin are common laboratory color reactions with different targets.","يكسر التحلل المائي الروابط الببتيدية. يخلّ التمسخ بالطي الأعلى غالبًا دون قطع التسلسل الأولي. يعد اختبار البيوريت والنينهيدرين من تفاعلات الألوان المخبرية ذات الأهداف المختلفة.","Which test detects peptide bonds?","أي اختبار يكشف الروابط الببتيدية؟","Biuret test","اختبار البيوريت"]];const root=document.getElementById('lessons'),nav=document.getElementById('nav');let lang='both',filter='all';function el(tag,cls,t){let x=document.createElement(tag);if(cls)x.className=cls;if(t!==undefined)x.textContent=t;return x}function render(){root.replaceChildren();nav.replaceChildren();lessons.forEach((d,i)=>{if(filter!=='all'&&d[0]!==filter)return;let a=el('a','',String(i+1)+' '+d[2]);a.href='#lesson-'+i;nav.append(a);let s=el('section','card');s.id='lesson-'+i;s.append(el('small','',d[0]+' · Unit '+(i+1)),el('h2','',d[2]+' / '+d[1]));for(let j=3;j<=8;j+=2){if(lang!=='en')s.append(el('p','part ar',d[j+1]));if(lang!=='ar')s.append(el('p','part en',d[j]));}let q=el('div','quiz');q.append(el('strong','',lang==='en'?'Self-check':lang==='ar'?'تدريب ذاتي':'تدريب ذاتي / Self-check'));if(lang!=='en')q.append(el('p','ar',d[10]));if(lang!=='ar')q.append(el('p','en',d[9]));let b=el('button','',lang==='en'?'Show answer':'أظهر الإجابة / Show answer');let ans=el('p','',lang==='en'?d[11]:lang==='ar'?d[12]:d[12]+' / '+d[11]);ans.hidden=true;b.onclick=()=>{ans.hidden=!ans.hidden;b.setAttribute('aria-expanded',String(!ans.hidden))};q.append(b,ans);s.append(q);root.append(s)})}for(let l of ['ar','en','both'])document.getElementById(l).onclick=()=>{lang=l;document.documentElement.lang=l==='en'?'en':'ar';document.documentElement.dir=l==='en'?'ltr':'rtl';render()};document.getElementById('filter').onchange=e=>{filter=e.target.value;render()};render();</script></html>
