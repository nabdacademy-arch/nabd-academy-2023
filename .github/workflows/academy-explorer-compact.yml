name: NABD compact internal explorer
on:
  pull_request:
    paths:
      - 'academy-full.html'
      - 'med-minute.html'
      - 'assets/css/med-minute.css'
      - 'assets/images/med-minute/**'
      - 'assets/css/academy-explorer-compact.css'
      - 'assets/js/academy-explorer-compact.js'
      - 'tests/academy-explorer-compact.cjs'
      - '.github/workflows/academy-explorer-compact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/academy-explorer-compact.cjs
