name: NABD Open Doors Essay Real Browser
on:
  push:
    paths:
      - 'open-doors-ai.html'
      - 'assets/js/open-doors-essay*.js'
      - 'assets/css/open-doors-essay.css'
      - 'tests/open-doors-essay-browser.cjs'
      - '.github/workflows/open-doors-essay-browser.yml'
  pull_request:
    paths:
      - 'open-doors-ai.html'
      - 'assets/js/open-doors-essay*.js'
      - 'assets/css/open-doors-essay.css'
      - 'tests/open-doors-essay-browser.cjs'
      - '.github/workflows/open-doors-essay-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test real rendered Open Doors essay lab
        run: |
          node --check tests/open-doors-essay-browser.cjs
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/nabd-open-doors-http.log 2>&1 &
          sleep 2
          node tests/open-doors-essay-browser.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-doors-essay-mobile-desktop
          path: essay-browser-results/
          retention-days: 7
