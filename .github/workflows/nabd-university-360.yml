name: NABD UNIVERSITY 360 verified release
on:
  pull_request:
    paths:
      - 'nabd-university-360.html'
      - 'nabd-360-lecturers.html'
      - 'index.html'
      - 'admin.html'
      - 'assets/js/nabd-360-*'
      - 'assets/css/nabd-360-*'
      - 'assets/js/nabd-campus-navigator.js'
      - 'assets/js/nabd-signature.js'
      - 'supabase/migrations/20261108_nabd_university_360_role_guard_and_learning.sql'
      - 'tests/nabd-360-*'
      - '.github/workflows/nabd-university-360.yml'
  push:
    branches: [main]
    paths:
      - 'nabd-university-360.html'
      - 'nabd-360-lecturers.html'
      - 'index.html'
      - 'admin.html'
      - 'assets/js/nabd-360-*'
      - 'assets/css/nabd-360-*'
      - 'assets/js/nabd-campus-navigator.js'
      - 'assets/js/nabd-signature.js'
      - 'supabase/migrations/20261108_nabd_university_360_role_guard_and_learning.sql'
      - 'tests/nabd-360-*'
      - '.github/workflows/nabd-university-360.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and RLS boundaries
        run: |
          node --check assets/js/nabd-360-student.js
          node --check assets/js/nabd-360-admin.js
          node tests/nabd-360-integrity.test.mjs
  browser:
    runs-on: ubuntu-24.04
    # The matching official image includes Chromium and native libraries.
    # Avoid runner-wide apt updates during browser provisioning.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          node -e 'const {chromium}=require("playwright"); (async()=>{const browser=await chromium.launch(); try { const page=await browser.newPage(); await page.setContent("<title>NABD CI</title>"); if(await page.title()!=="NABD CI") throw new Error("Chromium smoke test failed"); } finally { await browser.close(); }})().catch(e=>{console.error(e); process.exitCode=1;})'
      - name: Run learner, lecturer, director and AI opt-in checks
        run: node tests/nabd-360-browser.cjs
