name: NABD Open Doors Masters Research Coach
on:
  push:
    paths:
      - 'open-doors-masters.html'
      - 'open-doors-ai.html'
      - 'assets/js/open-doors-masters*.js'
      - 'assets/css/open-doors-masters.css'
      - 'tests/open-doors-masters.test.cjs'
      - '.github/workflows/open-doors-masters-check.yml'
  pull_request:
    paths:
      - 'open-doors-masters.html'
      - 'open-doors-ai.html'
      - 'assets/js/open-doors-masters*.js'
      - 'assets/css/open-doors-masters.css'
      - 'tests/open-doors-masters.test.cjs'
      - '.github/workflows/open-doors-masters-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  master-bank-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript
        run: |
          node --check assets/js/open-doors-masters-bank.js
          node --check assets/js/open-doors-masters.js
      - name: Run subject bank, generator, scoring and integration tests
        run: node tests/open-doors-masters.test.cjs
