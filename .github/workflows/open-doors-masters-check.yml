name: NABD Open Doors Masters Tests
on:
  push:
    paths:
      - 'open-doors-masters.html'
      - 'open-doors-ai.html'
      - 'assets/js/open-doors-masters*.js'
      - 'assets/css/open-doors-masters.css'
      - 'tests/open-doors-masters*.cjs'
      - '.github/workflows/open-doors-masters-check.yml'
  pull_request:
    paths:
      - 'open-doors-masters.html'
      - 'open-doors-ai.html'
      - 'assets/js/open-doors-masters*.js'
      - 'assets/css/open-doors-masters.css'
      - 'tests/open-doors-masters*.cjs'
      - '.github/workflows/open-doors-masters-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bank-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts
        run: |
          node --check assets/js/open-doors-masters-bank.js
          node --check assets/js/open-doors-masters.js
      - name: Test Master's original questions, variants, sources, simulator and privacy
        run: node tests/open-doors-masters.test.cjs
