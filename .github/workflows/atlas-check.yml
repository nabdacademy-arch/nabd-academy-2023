name: NABD ATLAS pilot checks
on:
  pull_request:
    paths:
      - 'atlas/**'
      - 'docs/ATLAS_ARCHITECTURE.md'
      - '.github/workflows/atlas-check.yml'
  push:
    branches:
      - 'feat/nabd-atlas-foundation'
    paths:
      - 'atlas/**'
      - '.github/workflows/atlas-check.yml'
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check atlas/app.mjs
          node --check atlas/scenario-data.mjs
          node --check atlas/sw.js
      - name: Scenario integrity and security guardrails
        run: node atlas/tests/verify.mjs
