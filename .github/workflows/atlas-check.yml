name: NABD ATLAS pilot checks
on:
  pull_request:
    paths:
      - 'atlas/**'
      - 'docs/ATLAS_ARCHITECTURE.md'
      - '.github/workflows/atlas-check.yml'
  push:
    branches:
      - 'feat/nabd-atlas-foundation'
    paths:
      - 'atlas/**'
      - '.github/workflows/atlas-check.yml'
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check atlas/app.mjs
          node --check atlas/scenario-data.mjs
          node --check atlas/sw.js
          node --check atlas/clinical-hub.mjs
          node --check atlas/clinical-cases.mjs
          node --check atlas/clinical-engine.mjs
          node --check atlas/tests/browser.mjs
      - name: Scenario integrity and security guardrails
        run: |
          node atlas/tests/verify.mjs
          node atlas/tests/clinical.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile browser and offline end-to-end checks
        run: node atlas/tests/browser.mjs
