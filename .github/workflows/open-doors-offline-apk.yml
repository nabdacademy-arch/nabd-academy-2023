name: Build NABD Open Doors Offline APK
on:
  workflow_dispatch:
  push:
    branches: [feature/open-doors-offline-android]
    paths:
      - 'android-offline/**'
      - '.github/workflows/open-doors-offline-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android-offline/android
      - uses: actions/upload-artifact@v4
        with:
          name: NABD-Open-Doors-Offline-debug-APK
          path: android-offline/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
