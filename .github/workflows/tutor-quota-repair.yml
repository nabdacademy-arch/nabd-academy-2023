name: NABD tutor quota RPC repair checks
on:
  pull_request:
    paths:
      - 'supabase/manual/fix_tutor_quota.sql'
      - 'learning/tests/quota-repair.cjs'
      - '.github/workflows/tutor-quota-repair.yml'
  push:
    branches:
      - 'fix/nabd-tutor-quota-rpc'
    paths:
      - 'supabase/manual/fix_tutor_quota.sql'
      - 'learning/tests/quota-repair.cjs'
      - '.github/workflows/tutor-quota-repair.yml'

permissions:
  contents: read

jobs:
  quota-database:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/nabd-quota-test" --no-fund --no-audit --no-save @electric-sql/pglite@0.3.15
      - name: Test idempotent SQL, 6/min quota, no JWT and private role isolation
        run: NODE_PATH="$RUNNER_TEMP/nabd-quota-test/node_modules" node learning/tests/quota-repair.cjs
