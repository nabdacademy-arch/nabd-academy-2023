name: NABD Open Doors Public Guest Access
on:
  pull_request:
    paths:
      - 'open-doors-ai.html'
      - 'open-doors-masters.html'
      - 'assets/js/open-doors-*.js'
      - 'assets/css/open-doors-public-home.css'
      - 'index.html'
      - 'supabase/migrations/20261122_open_doors_public_readonly_practice.sql'
      - 'tests/open-doors-public-access.test.cjs'
      - '.github/workflows/open-doors-public.yml'
  push:
    branches: [main]
    paths:
      - 'open-doors-ai.html'
      - 'open-doors-masters.html'
      - 'assets/js/open-doors-*.js'
      - 'assets/css/open-doors-public-home.css'
      - 'index.html'
      - 'supabase/migrations/20261122_open_doors_public_readonly_practice.sql'
      - 'tests/open-doors-public-access.test.cjs'
      - '.github/workflows/open-doors-public.yml'
permissions:
  contents: read
jobs:
  guest-access-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate guest modules and the protected AI backend
        run: |
          node --check assets/js/open-doors-choice.js
          node --check assets/js/open-doors-essay.js
          node --check assets/js/open-doors-masters.js
      - name: Check the public no-login user journeys and immutable privacy boundary
        run: node --test tests/open-doors-public-access.test.cjs
      - name: Verify original question banks, scoring and written rubrics
        run: |
          node tests/open-doors-choice.test.cjs
          node tests/open-doors-essay.test.cjs
          node tests/open-doors-masters.test.cjs
