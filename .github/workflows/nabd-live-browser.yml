name: NABD deployed multi-page browser smoke
on:
  pull_request:
    paths:
      - 'tests/nabd-live-browser.cjs'
      - '.github/workflows/nabd-live-browser.yml'
  push:
    branches: [main]
    paths:
      - 'tests/nabd-live-browser.cjs'
      - '.github/workflows/nabd-live-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Visit live portals without accounts or data writes
        run: node tests/nabd-live-browser.cjs
      - name: Save browser audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabd-live-browser-audit
          path: audit/live-browser-report.json
          if-no-files-found: ignore
