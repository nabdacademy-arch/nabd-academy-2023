name: NABD Councils Network Checks
on:
  push:
    paths:
      - 'councils.html'
      - 'admin.html'
      - 'assets/js/nabd-councils-director.js'
      - 'assets/css/nabd-councils-director.css'
      - 'supabase/functions/nabd-council-provision/index.ts'
      - 'supabase/migrations/20261121_guard_profile_roles_for_councils.sql'
      - 'supabase/migrations/20261121_council_account_provisioning_audit.sql'
      - 'tests/council-director-provisioning.test.cjs'
      - 'assets/js/councils.js'
      - 'assets/css/councils.css'
      - 'assets/images/councils/**'
      - 'assets/js/academic-core.js'
      - 'assets/js/nabd-signature.js'
      - 'academy.html'
      - 'index.html'
      - 'assets/css/nabd-councils-home.css'
      - 'tests/councils-homepage.test.cjs'
      - 'supabase/migrations/20261121_nabd_councils_network.sql'
      - 'tests/councils-gateway.test.cjs'
      - 'tests/councils-design.test.cjs'
      - '.github/workflows/councils-gateway.yml'
  pull_request:
    paths:
      - 'councils.html'
      - 'admin.html'
      - 'assets/js/nabd-councils-director.js'
      - 'assets/css/nabd-councils-director.css'
      - 'supabase/functions/nabd-council-provision/index.ts'
      - 'supabase/migrations/20261121_guard_profile_roles_for_councils.sql'
      - 'supabase/migrations/20261121_council_account_provisioning_audit.sql'
      - 'tests/council-director-provisioning.test.cjs'
      - 'assets/js/councils.js'
      - 'assets/css/councils.css'
      - 'assets/images/councils/**'
      - 'assets/js/academic-core.js'
      - 'assets/js/nabd-signature.js'
      - 'academy.html'
      - 'index.html'
      - 'assets/css/nabd-councils-home.css'
      - 'tests/councils-homepage.test.cjs'
      - 'supabase/migrations/20261121_nabd_councils_network.sql'
      - 'tests/councils-gateway.test.cjs'
      - 'tests/councils-design.test.cjs'
      - '.github/workflows/councils-gateway.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse gateway scripts
        run: |
          node --check assets/js/councils.js
          node --check assets/js/nabd-councils-director.js
          node --check assets/js/academic-core.js
          node --check assets/js/nabd-signature.js
      - name: Validate eight councils, protected routes and design assets
        run: |
          node --test tests/councils-gateway.test.cjs tests/councils-design.test.cjs tests/councils-homepage.test.cjs tests/council-director-provisioning.test.cjs
      - name: Verify local SVG artwork XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          assets=list(Path("assets/images/councils").glob("*.svg"))
          assert len(assets)==9, f"Expected 9 local illustrations, got {len(assets)}"
          for image in assets:
              ET.parse(image)
          print("Verified 9 local SVG illustrations")
          PY
