name: NABD Head Neck Private Offline APK
on:
  push:
    branches:
      - feature/headneck-offline-apk
    paths:
      - 'offline-headneck-android/**'
      - 'director-headneck.html'
      - '.github/workflows/headneck-offline-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Transform original Head Neck app to offline
        run: |
          node offline-headneck-android/patch.cjs director-headneck.html offline-headneck-android/app/src/main/assets/index.html
          node - <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('offline-headneck-android/app/src/main/assets/index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m)throw Error('Patched script missing');
          new (require('vm').Script)(m[1]);
          if(s.includes('cdn.jsdelivr.net')||s.includes('sb.auth'))throw Error('Online browser dependency present');
          if(!s.includes('showLogin()')||!s.includes('NABDApp.signIn'))throw Error('Director login form is missing');
          console.log('Offline app JavaScript verified');
          NODE
      - name: Build APK
        working-directory: offline-headneck-android
        run: gradle --no-daemon assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NABD-HeadNeck-Private-Offline-APK
          path: offline-headneck-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
