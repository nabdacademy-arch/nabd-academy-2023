name: NABD ONE integrated release
on:
  pull_request:
    paths:
      - 'nabd-one.html'
      - 'nabd-connect.html'
      - 'admin.html'
      - 'index.html'
      - 'assets/css/nabd-one*.css'
      - 'assets/js/nabd-one*.js'
      - 'assets/js/nabd-connect.js'
      - 'assets/js/nabd-assistant.js'
      - 'assets/js/nabd-signature.js'
      - 'assets/js/nabd-campus-navigator.js'
      - 'supabase/migrations/20261108_nabd_one_connect_secure_tickets_v1.sql'
      - 'tests/nabd-one-*'
      - '.github/workflows/nabd-one.yml'
  push:
    branches: [main]
    paths:
      - 'nabd-one.html'
      - 'nabd-connect.html'
      - 'admin.html'
      - 'index.html'
      - 'assets/css/nabd-one*.css'
      - 'assets/js/nabd-one*.js'
      - 'assets/js/nabd-connect.js'
      - 'assets/js/nabd-assistant.js'
      - 'assets/js/nabd-signature.js'
      - 'assets/js/nabd-campus-navigator.js'
      - 'supabase/migrations/20261108_nabd_one_connect_secure_tickets_v1.sql'
      - 'tests/nabd-one-*'
      - '.github/workflows/nabd-one.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new scripts and access boundaries
        run: |
          node --check assets/js/nabd-one-public.js
          node --check assets/js/nabd-connect.js
          node --check assets/js/nabd-one-admin.js
          node tests/nabd-one-integrity.test.mjs
  browser:
    runs-on: ubuntu-24.04
    # The matching official image includes Chromium and native libraries.
    # Avoid runner-wide apt updates during browser provisioning.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium runner
        run: |
          npm install --no-save playwright@1.56.1
          node -e 'const {chromium}=require("playwright"); (async()=>{const browser=await chromium.launch(); try { const page=await browser.newPage(); await page.setContent("<title>NABD CI</title>"); if(await page.title()!=="NABD CI") throw new Error("Chromium smoke test failed"); } finally { await browser.close(); }})().catch(e=>{console.error(e); process.exitCode=1;})'
      - name: Exercise real workflows with mocked accounts (no production writes)
        run: node tests/nabd-one-browser.cjs
