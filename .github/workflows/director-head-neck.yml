name: Director Head & Neck Assistant Checks
on:
  push:
    paths:
      - 'assets/js/nabd-director-exam-bot.js'
      - 'assets/css/nabd-director-exam-bot.css'
      - 'nabd-ai-executive.html'
      - 'admin.html'
      - '.github/workflows/director-head-neck.yml'
  pull_request:
    paths:
      - 'assets/js/nabd-director-exam-bot.js'
      - 'nabd-ai-executive.html'
      - 'admin.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check private tutor JavaScript syntax
        run: node --check assets/js/nabd-director-exam-bot.js
      - name: Check director-only single launcher and prevent stale launchers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const page of ['admin.html','nabd-ai-executive.html']) {
            const html = fs.readFileSync(page, 'utf8');
            const canonical = html.match(/src="assets\/js\/nabd-director-exam-bot\.js\?v=6"/g) || [];
            if(canonical.length !== 1) throw new Error(page+': expected exactly one current tutor launcher');
            if(/src="assets\/js\/(?:director-headneck-launch|nabd-director-head-neck)\.js/.test(html)) {
              throw new Error(page+': old conflicting exam launcher is still mounted');
            }
          }
          const executive = fs.readFileSync('nabd-ai-executive.html', 'utf8');
          if (executive.includes('</main><script defer src="assets/js/nabd-campus-navigator.js')) {
            throw new Error('Malformed certificate preview script was reintroduced');
          }
          const assistant = fs.readFileSync('assets/js/nabd-director-exam-bot.js','utf8');
          for (const fragment of ['nebBankPane','nebBankList','filterBankBrowser','BANK_PAGE_SIZE=20','loadBankBrowser','neb-choice','تأكيد إجابتي','nabd_exam_progress','nebBankVerification','neb-translate-btn','requestArabicTranslation','translationState']) {
            if (!assistant.includes(fragment)) throw new Error('Private question browser missing '+fragment);
          }
          const landing = fs.readFileSync('index.html', 'utf8');
          if (landing.includes('nabd-director-exam-bot.js')) {
            throw new Error('Director-only assistant must not mount on public landing page');
          }
          NODE
      - name: Prevent shipping private question bank files
        run: |
          if find . -type f -name '*Head_Neck_Exam_Bank*' | grep -q .; then
            echo "Exam bank must remain in RLS-protected database"
            exit 1
          fi
