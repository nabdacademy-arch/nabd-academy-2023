name: NABD Smart Messenger
on:
  pull_request:
    paths:
      - 'assets/js/nabd-assistant.js'
      - 'assets/css/nabd-assistant.css'
      - 'assets/js/nabd-signature.js'
      - 'assets/js/nabd-campus-navigator.js'
      - 'index.html'
      - 'tests/nabd-assistant-*'
      - '.github/workflows/nabd-assistant.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/nabd-assistant.js'
      - 'assets/css/nabd-assistant.css'
      - 'assets/js/nabd-signature.js'
      - 'assets/js/nabd-campus-navigator.js'
      - 'index.html'
      - 'tests/nabd-assistant-*'
      - '.github/workflows/nabd-assistant.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safe chatbot JS and routes
        run: |
          node --check assets/js/nabd-assistant.js
          node tests/nabd-assistant-integrity.test.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test right dock and real user journey
        run: node tests/nabd-assistant-browser.cjs
