const domains=[["continuity",25,"استمرارية التعلم","Learning continuity"],["offline",20,"العمل دون اتصال","Offline operation"],["retention",20,"الاحتفاظ بالمعرفة","Knowledge retention"],["assessment",15,"استمرارية التقييم","Assessment continuity"],["access",10,"إمكانية الوصول","Accessibility"],["recovery",10,"التعافي","Recovery"]],modules=[["cell","الخلية","Cell biology","الغشاء ينظم انتقال المواد، والريبوسومات تصنع البروتين. الميتوكوندريا تسهم في إنتاج ATP.","Membranes regulate transport; ribosomes synthesize proteins; mitochondria contribute to ATP production.","ما العضية المسؤولة مباشرة عن تصنيع البروتين؟","Which structure directly synthesizes proteins?",["الريبوسوم","النواة","الجسيم الحال"],["Ribosome","Nucleus","Lysosome"],0],["dna","الوراثة","Genetics","يحمل DNA المعلومات الوراثية. النسخ ينتج RNA من قالب DNA، والترجمة تصنع سلسلة ببتيدية.","DNA stores genetic information. Transcription makes RNA from a DNA template; translation produces a polypeptide.","ما ناتج النسخ؟","What is the product of transcription?",["دهون","RNA","ATP"],["Lipids","RNA","ATP"],1],["blood","الدم","Blood","تنقل الكريات الحمراء الأكسجين بواسطة الهيموغلوبين. تشارك الصفائح في الإرقاء.","Red cells transport oxygen via hemoglobin. Platelets participate in hemostasis.","ما البروتين الرئيس الناقل للأكسجين في الدم؟","Which protein primarily carries oxygen in blood?",["الكولاجين","الإنسولين","الهيموغلوبين"],["Collagen","Insulin","Hemoglobin"],2],["heart","القلب","Cardiovascular physiology","يضخ البطين الأيمن الدم نحو الرئتين، والأيسر نحو الدورة الجهازية. تحد الصمامات من الجريان العكسي.","The right ventricle pumps toward the lungs; the left toward systemic circulation. Valves limit backflow.","أي حجرة تضخ إلى الدورة الجهازية؟","Which chamber pumps into systemic circulation?",["البطين الأيسر","الأذين الأيمن","البطين الأيمن"],["Left ventricle","Right atrium","Right ventricle"],0],["lung","التنفس","Respiratory physiology","يحدث تبادل الغازات أساسًا عبر الحويصلات الرئوية بالانتشار وفق فروق الضغط الجزئي.","Gas exchange occurs chiefly across alveoli by diffusion along partial-pressure gradients.","أين يحدث التبادل الغازي أساسًا؟","Where does gas exchange primarily occur?",["القصبة الهوائية","الحويصلات","الحنجرة"],["Trachea","Alveoli","Larynx"],1],["kidney","الكلى","Renal physiology","النيفرون الوحدة الوظيفية للكلى. ترشح الكبيبة البلازما، وتعدل الأنابيب تركيب الرشاحة.","The nephron is the functional unit of the kidney. Glomeruli filter plasma; tubules modify filtrate.","ما الوحدة الوظيفية للكلى؟","What is the functional unit of the kidney?",["العصبون","الحويصلة","النيفرون"],["Neuron","Alveolus","Nephron"],2],["immune","المناعة","Immunology","المناعة الفطرية سريعة وغير نوعية نسبيًا. المناعة التكيفية تشمل الخلايا البائية والتائية والذاكرة المناعية.","Innate immunity is rapid and relatively nonspecific. Adaptive immunity involves B and T cells and memory.","أي خلايا تتمايز إلى خلايا بلازمية منتجة للأجسام المضادة؟","Which cells differentiate into antibody-producing plasma cells?",["الخلايا البائية","الكريات الحمراء","الصفائح"],["B cells","Red cells","Platelets"],0],["micro","الأحياء الدقيقة","Microbiology","البكتيريا كائنات خلوية، بينما تعتمد الفيروسات على خلايا المضيف للتكاثر. المضادات الحيوية لا تعالج العدوى الفيروسية ذاتها.","Bacteria are cellular organisms; viruses depend on host cells for replication. Antibiotics do not treat viral infections themselves.","أي كيان يعتمد على خلية مضيفة للتكاثر؟","Which entity depends on a host cell for replication?",["كريات الدم الحمراء","الفيروس","الريبوسوم"],["Red blood cell","Virus","Ribosome"],1],["epi","الوبائيات","Epidemiology","الحدوث يقيس الحالات الجديدة خلال فترة محددة، والانتشار يقيس الحالات الموجودة في مجتمع عند نقطة أو فترة.","Incidence measures new cases over a specified interval; prevalence measures existing cases at a point or over a period.","أي مقياس يركز على الحالات الجديدة؟","Which measure focuses on new cases?",["الانتشار","النوعية","الحدوث"],["Prevalence","Specificity","Incidence"],2],["research","البحث العلمي","Research methods","الارتباط لا يثبت السببية. قد يؤدي الالتباس والتحيز إلى نتائج مضللة؛ تساعد الشفافية والتصميم الملائم في تفسيرها.","Association does not establish causation. Confounding and bias may mislead; transparent methods and suitable design aid interpretation.","هل يثبت الارتباط وحده السببية؟","Does association alone establish causation?",["لا","نعم دائمًا","فقط إذا كان موجبًا"],["No","Always","Only if positive"],0]];
function indexScore(rows){if(!Array.isArray(rows)||rows.length!==domains.length)return null;let weighted=0,equal=0;const parts=[];for(let i=0;i<domains.length;i++){const r=rows[i],d=domains[i];if(!r||r.id!==d[0]||!Number.isSafeInteger(r.n)||!Number.isSafeInteger(r.d)||r.n<0||r.d<=0||r.n>r.d||typeof r.e!=="string"||!/^[A-Za-z0-9_-]{1,40}$/.test(r.e))return null;const p=100*r.n/r.d;weighted+=p*d[1]/100;equal+=p/domains.length;parts.push({id:r.id,percent:Math.round(p*10)/10,weight:d[1]});}return {weighted:Math.round(weighted*10)/10,equal:Math.round(equal*10)/10,parts};}
function validateRecord(x){return !!(x&&x.schema==="NMERI-10"&&["demo","observed"].includes(x.mode)&&typeof x.period==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(x.period)&&indexScore(x.rows));}
function validProgress(x){return !!(x&&x.schema==="NABD-ZERO-10"&&x.answers&&typeof x.answers==="object"&&!Array.isArray(x.answers)&&Object.keys(x.answers).length<=modules.length&&Object.keys(x.answers).every(k=>modules.some(m=>m[0]===k)&&Number.isInteger(x.answers[k])&&x.answers[k]>=0&&x.answers[k]<3));}
function progressStats(x){if(!validProgress(x))return null;return {completed:Object.keys(x.answers).length,correct:modules.filter(m=>x.answers[m[0]]===m[9]).length,total:modules.length};}

let lang="ar",progress={schema:"NABD-ZERO-10",answers:{}},lastLab=null,storageOK=false;
const t=k=>tr[lang][k]||k;
function loadLocal(){try{const k="nabd-zero-v10";localStorage.setItem(k+"-probe","1");localStorage.removeItem(k+"-probe");storageOK=true;const raw=localStorage.getItem(k);if(raw){const parsed=JSON.parse(raw);if(validProgress(parsed))progress=parsed;}}catch{storageOK=false;}}
function saveLocal(){try{localStorage.setItem("nabd-zero-v10",JSON.stringify(progress));storageOK=true;}catch{storageOK=false;}$("storage").textContent=t(storageOK?"storageOK":"storageFail");}
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;}
function stats(){const p=progressStats(progress);$("complete").textContent=p.completed+" / "+p.total;$("correct").textContent=p.correct+" / "+p.total;}
function renderUnits(){const host=$("units");host.replaceChildren();modules.forEach(m=>{const ar=lang==="ar",card=el("article",undefined,"tile");card.append(el("h3",m[ar?1:2]),el("p",m[ar?3:4]),el("p",m[ar?5:6]));m[ar?7:8].forEach((a,i)=>{const b=el("button",a,"alt answer"+(progress.answers[m[0]]===i?" selected":""));b.type="button";b.setAttribute("aria-pressed",String(progress.answers[m[0]]===i));b.onclick=()=>{progress.answers[m[0]]=i;saveLocal();stats();renderUnits();const again=$("units").querySelector('[data-unit="'+m[0]+'-'+i+'"]');if(again)again.focus();};b.dataset.unit=m[0]+"-"+i;card.append(b);});if(Object.hasOwn(progress.answers,m[0]))card.append(el("p",t(progress.answers[m[0]]===m[9]?"right":"wrong")));host.append(card);});}

function buildDomains(){const host=$("domains");host.replaceChildren();domains.forEach((m,i)=>{const box=el("article",undefined,"tile");box.append(el("h3",undefined),el("p",undefined,"muted"));box.children[0].id="h"+i;box.children[1].id="def"+i;["n","d","e"].forEach(k=>{const l=el("label"),s=el("span");s.id=k+"label"+i;const input=document.createElement("input");input.id=k+i;input.type=k==="e"?"text":"number";if(k==="e")input.maxLength=40;else{input.min=k==="n"?"0":"1";input.step="1";}l.append(s,input);box.append(l);});host.append(box);});}
