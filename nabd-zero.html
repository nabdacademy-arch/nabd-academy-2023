<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09252e"><title>NABD ZERO | NMERI v0.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f5;color:#15323a;font:16px/1.75 system-ui,Arial,sans-serif}main{max-width:1050px;margin:auto;padding:20px}header{background:#09252e;color:white;border-radius:22px;padding:30px;margin-bottom:18px}header h1{font-size:clamp(32px,8vw,65px);letter-spacing:.08em;margin:0;direction:ltr;text-align:start}header p{max-width:700px}h2,h3{line-height:1.35}section{background:white;border:1px solid #d4e1df;border-radius:16px;padding:20px;margin:15px 0}button,a.action{background:#00675e;color:white;border:0;padding:10px 15px;border-radius:8px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.alt{background:#e4efed;color:#15323a}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c87700;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.muted{color:#46616a}.tag{font-size:14px;background:#d8f5e9;color:#11493e;border-radius:20px;padding:5px 12px;display:inline-block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.metric{border:1px solid #d4e1df;border-radius:12px;padding:14px}.metric h3{margin:0}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-weight:600;font-size:14px}input,select{width:100%;padding:8px;font:inherit;border:1px solid #78918e;border-radius:7px;background:white;color:#15323a}input[type=number]{direction:ltr}#result{font-size:36px;font-weight:800;color:#00675e}.track{height:10px;background:#deebe8;border-radius:10px;overflow:hidden}.bar{height:100%;background:#007e72;width:0}.warning{border-inline-start:4px solid #ad6c0c;padding:8px 12px;background:#fff5df}small{display:block}footer{padding:10px;color:#46616a}@media print{.actions,button{display:none}body{background:white}section{break-inside:avoid}header{color:#15323a;background:white}}
</style></head><body><main>
<header><span class="tag" id="status"></span><h1>NABD ZERO</h1><p id="hero"></p><p id="org"></p><div class="actions"><button class="alt" id="lang" type="button">English</button><button class="alt" id="offline" type="button"></button></div></header>
<section><h2 id="aboutH"></h2><p id="about"></p><p class="warning" id="warning"></p></section>
<section><h2>NMERI v0.1 — <span id="calculatorH"></span></h2><p id="instructions"></p><div class="grid"><label><span id="modeLabel"></span><select id="mode"><option value="real" id="real"></option><option value="demo" id="demo"></option></select></label><label><span id="windowLabel"></span><input id="window" maxlength="80" autocomplete="off"></label></div><div id="metrics" class="grid"></div><div class="actions"><button id="calculate" type="button"></button><button id="example" class="alt" type="button"></button><button id="reset" class="alt" type="button"></button><button id="export" class="alt" type="button"></button><button id="print" class="alt" type="button"></button></div><div id="result" role="status" aria-live="polite">—</div><div class="track" aria-hidden="true"><div class="bar" id="bar"></div></div><p id="detail" class="muted"></p></section>
<section><h2 id="pilotH"></h2><div id="pilot"></div></section><section><h2 id="fundH"></h2><p id="fund"></p><p id="deliverables"></p></section><footer id="footer"></footer>
</main><script>
"use strict";
const metrics=[["continuity","استمرارية التعلم","Learning continuity",25,"نسبة الأنشطة المخططة التي أُتيحت وأُنجزت أثناء فترة الانقطاع","Proportion of planned activities completed during the disruption window"],["offline","العمل دون اتصال","Offline operation",20,"نسبة الوظائف التعليمية الأساسية التي نجحت في اختبار دون اتصال","Proportion of essential learning functions passing an offline test"],["retention","الاحتفاظ بالمعرفة","Knowledge retention",20,"نسبة الإجابات الصحيحة في اختبار متابعة موحد بعد سبعة أيام","Proportion of correct answers on a standardized seven-day follow-up assessment"],["assessment","استمرارية التقييم","Assessment continuity",15,"نسبة محاولات التقييم المخططة التي اكتملت وحُفظت دون فقد","Proportion of planned assessments completed and saved without loss"],["access","إمكانية الوصول","Accessibility",10,"نسبة المشاركين المؤهلين الذين تمكنوا من إتمام المهمة المرجعية بأجهزتهم المتاحة","Proportion of eligible participants able to complete a reference task with available devices"],["recovery","التعافي","Recovery",10,"نسبة اختبارات استعادة الحالة التي نجحت خلال مهلة محددة مسبقًا","Proportion of state recovery tests passed within a predeclared time limit"]];
function score(rows){if(!Array.isArray(rows)||rows.length!==6||rows.some(r=>!Number.isSafeInteger(r.n)||!Number.isSafeInteger(r.d)||r.d<=0||r.n<0||r.n>r.d||typeof r.e!=="string"||!r.e.trim()))return null;return Math.round(rows.reduce((s,r,i)=>s+metrics[i][3]*r.n/r.d,0)*10)/10;}
const $=id=>document.getElementById(id);
const dict={
ar:{status:"نموذج بحثي أولي • غير معتمد",hero:"استمرارية المعرفة الطبية في ظروف الانقطاع والأزمات",org:"أكاديمية نبض للعلوم الطبية | فلسطين",offline:"تنزيل نسخة تعمل دون اتصال",aboutH:"رسالة المشروع",about:"تطوير واختبار أداة قابلة لإعادة الاستخدام لقياس صمود التعليم الطبي عند انقطاع البنية التحتية، ونشر المنهجية والنتائج بعد التحكيم المستقل.",warning:"لا تمثل الأوزان أو النتيجة معيارًا معتمدًا. لا تدخل أسماء أو هويات أو بيانات مرضى أو روابط خاصة. لا تُرسل البيانات إلى خادم؛ تبقى في الصفحة حتى التصدير اليدوي.",calculatorH:"حاسبة المؤشر التجريبية",instructions:"أدخل البسط والمقام لكل بُعد ومرجع دليل غير حساس. يجب أن يكون المقام أكبر من صفر؛ لا تُحسب نتيجة كلية عند نقص البيانات. حدّد المقامات والمهلة قبل التجربة.",modeLabel:"نوع البيانات",real:"بيانات فعلية غير متحقق منها",demo:"بيانات اصطناعية للتوضيح",windowLabel:"فترة القياس (وصف غير شخصي)",n:"عدد النجاحات",d:"إجمالي الفرص",e:"مرجع الدليل (رمز فقط)",calculate:"احسب المؤشر",example:"مثال اصطناعي",reset:"مسح",export:"تصدير JSON",print:"طباعة",invalid:"النتيجة غير متاحة: أكمل جميع الأعداد الصحيحة والمراجع وفترة القياس.",ready:"أدخل البيانات أو استخدم المثال.",demoResult:"نتيجة اصطناعية للتوضيح فقط",realResult:"نتيجة ذاتية غير مدققة؛ ليست اعتمادًا",pilotH:"بروتوكول الدراسة الأولية",pilot:["هدف مقترح: 100 متطوع بالغ، 30 يومًا، 10 وحدات تعليمية؛ تقدير الحجم يحتاج مراجعة إحصائية.","قبل البدء: موافقة أخلاقية مستقلة، موافقة مستنيرة، حق الانسحاب دون تأثير على الدراسة، واختبار تجريبي تقني صغير.","تقييم قبلي وبعدي ومتابعة بعد سبعة أيام؛ قياس استهلاك البيانات وزمن التعافي، وتسجيل المفقودات والانحيازات.","لا تُقطع الخدمات عن الطلاب ولا تُحجب عنهم مصادر التعليم. اختبار عدم الاتصال على بيئة آمنة ومصرح بها.","تثبيت تعريفات المقامات وأوزان المؤشر مسبقًا؛ تحليل حساسية بأوزان متساوية، ونشر النتائج السلبية والإيجابية المجمعة دون بيانات فردية."],fundH:"فرصة التعاون والتمويل",fund:"ندعو الشركاء المحتملين للمراجعة المنهجية، والتطوير دون اتصال، ودعم الأجهزة والاتصال وإجراء الدراسة بأمان. لا توجد شراكة أو منحة معلنة ضمن هذا النموذج.",deliverables:"المخرجات المقترحة: بروتوكول مسجل، حزمة تعليمية دون اتصال، مؤشر مفتوح المنهجية، تقرير تحقق مستقل ونتائج قابلة للنشر.",footer:"NABD ZERO • الإصدار 0.1 • نموذج أولي — لا نتائج ميدانية حتى الآن."},
en:{status:"Research prototype • Not validated",hero:"Medical knowledge continuity through disruption and crisis",org:"NABD Academy for Medical Sciences | Palestine",offline:"Download offline copy",aboutH:"Mission",about:"Develop and test a reusable measure of medical education resilience under infrastructure disruption; publish methods and results after independent review.",warning:"Weights and scores are not validated. Do not enter names, IDs, patient data or private links. No data are transmitted to a server; entries remain in the page until manual export.",calculatorH:"Experimental index calculator",instructions:"Enter a numerator, denominator and non-sensitive evidence reference for each domain. Denominators must be positive; incomplete records cannot produce an overall score. Predeclare denominators and deadlines.",modeLabel:"Data type",real:"Real, unverified self-report",demo:"Synthetic demonstration",windowLabel:"Measurement period (nonpersonal)",n:"Successful events",d:"Eligible opportunities",e:"Evidence reference (code only)",calculate:"Calculate index",example:"Synthetic example",reset:"Clear",export:"Export JSON",print:"Print",invalid:"Unavailable: complete all integer counts, references and the measurement period.",ready:"Enter data or load the example.",demoResult:"Synthetic illustration only",realResult:"Unaudited self-report; not accreditation",pilotH:"Proposed pilot protocol",pilot:["Proposed target: 100 adult volunteers, 30 days, 10 learning units; sample size requires statistical review.","Before recruitment: independent ethics approval, informed consent, withdrawal without educational penalty, and a small technical pilot.","Baseline, post-test and seven-day follow-up; measure data use and recovery time; document missingness and bias.","Do not deprive students of existing services. Offline testing only in a safe, authorized environment.","Preregister denominator definitions and weights; run equal-weight sensitivity analysis and publish aggregate positive and negative results without individual data."],fundH:"Research and funding opportunity",fund:"Potential collaborators are invited to review methods, develop offline learning, support devices and connectivity, and fund a safe study. No partnership or award is claimed.",deliverables:"Proposed outputs: registered protocol, offline learning package, transparent index, independent validation report and publishable results.",footer:"NABD ZERO • Version 0.1 • Prototype — no field results yet."}};
let lang="ar";
function render(){const t=dict[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";Object.keys(t).filter(k=>$(k)&&k!=="pilot").forEach(k=>$(k).textContent=t[k]);$("lang").textContent=lang==="ar"?"English":"العربية";$("pilot").replaceChildren(...t.pilot.map(s=>{const p=document.createElement("p");p.textContent=s;return p;}));metrics.forEach((m,i)=>{ $("mh"+i).textContent=m[lang==="ar"?1:2]+" · "+m[3]+"%";$("md"+i).textContent=m[lang==="ar"?4:5];["n","d","e"].forEach(k=>$(k+"l"+i).textContent=t[k]);});update();}
metrics.forEach((m,i)=>{const box=document.createElement("article");box.className="metric";box.innerHTML='<h3 id="mh'+i+'"></h3><p class="muted" id="md'+i+'"></p><div class="inputs"><label><span id="nl'+i+'"></span><input type="number" min="0" step="1" id="n'+i+'"></label><label><span id="dl'+i+'"></span><input type="number" min="1" step="1" id="d'+i+'"></label></div><label><span id="el'+i+'"></span><input maxlength="80" autocomplete="off" id="e'+i+'"></label>'; $("metrics").append(box);});
function rows(){return metrics.map((m,i)=>({id:m[0],n:$("n"+i).value===""?NaN:Number($("n"+i).value),d:$("d"+i).value===""?NaN:Number($("d"+i).value),e:$("e"+i).value.trim()}));}
function update(){const t=dict[lang],r=rows(),s=$("window").value.trim()?score(r):null;$("result").textContent=s===null?"—":s+" / 100";$("bar").style.width=(s===null?0:s)+"%";$("detail").textContent=s===null?t.invalid:($("mode").value==="demo"?t.demoResult:t.realResult);$("export").disabled=s===null;return s;}
function download(data,type,name){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";render();};$("calculate").onclick=update;$("metrics").addEventListener("input",update);$("window").oninput=update;$("mode").onchange=()=>{clear();};function clear(){metrics.forEach((m,i)=>["n","d","e"].forEach(k=>$(k+i).value=""));$("window").value="";update();}$("reset").onclick=clear;
$("example").onclick=()=>{$("mode").value="demo";$("window").value="Synthetic scenario / مثال اصطناعي";[8,9,6,7,8,5].forEach((n,i)=>{$("n"+i).value=n;$("d"+i).value=10;$("e"+i).value="DEMO-"+(i+1);});update();};
$("export").onclick=()=>{const s=update();if(s===null)return;download(JSON.stringify({schema:"NMERI-0.1",mode:$("mode").value,period:$("window").value.trim(),score:s,domains:rows().map((r,i)=>({...r,weight:metrics[i][3]})),validated:false},null,2),"application/json","nmeri-"+$("mode").value+".json");};$("print").onclick=()=>window.print();
$("offline").onclick=()=>{const copy=document.documentElement.cloneNode(true);copy.querySelector("#metrics").replaceChildren();copy.querySelectorAll("input").forEach(x=>x.removeAttribute("value"));copy.querySelector("#mode").value="real";copy.querySelector("#result").textContent="—";copy.querySelector("#detail").textContent="";copy.querySelector("#bar").removeAttribute("style");download("<!doctype html>"+copy.outerHTML,"text/html;charset=utf-8","nabd-zero.html");};
render();
</script></body></html>
