<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>body{font-family:Arial;margin:0;background:#f4f9fa;color:#092f39}.wrap{width:min(1200px,94%);margin:auto}.hero{margin:20px 0;padding:25px;border-radius:24px;background:linear-gradient(135deg,#052d38,#087a82);color:white}.card{background:white;border:1px solid #dcebed;border-radius:20px;padding:18px;margin:15px 0}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:#079b9b;color:white;cursor:pointer}.danger{background:#be4353}.secondary{background:#eaf7f8;color:#087e84}.input{width:100%;padding:11px;border:1px solid #dcebed;border-radius:12px;box-sizing:border-box}.hidden{display:none!important}.status{padding:12px;border-radius:12px;background:#eaf7f8;margin:12px 0}.error{background:#ffedf0;color:#b43e4e}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid #e6eff0;text-align:left}.scroll{overflow:auto}.modalbg{position:fixed;inset:0;background:#00181fa3;display:grid;place-items:center;padding:15px;z-index:1000}.modal{background:white;border-radius:20px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}.cert-preview{width:100%;border-radius:12px;border:1px solid #dcebed;margin-top:12px}</style></head>
<body><section id="login" class="wrap"><div class="card" style="max-width:450px;margin:60px auto"><h1>Director Login</h1><form id="loginForm"><p>Email</p><input id="email" class="input" type="email" required><p>Password</p><input id="password" class="input" type="password" required><button class="btn" style="margin-top:15px;width:100%">Sign in</button></form><div id="loginMsg" class="status hidden"></div></div></section>
<main id="app" class="wrap hidden"><div class="hero"><h1>Control Center</h1><p>Signed in as <b id="adminName"></b> · ADMIN</p><button id="logout" class="btn secondary">Sign out</button></div><div id="msg" class="status hidden"></div>
<div class="tabs"><button class="btn" data-tab="students">Students</button><button class="btn secondary" data-tab="enrollments">Enrollments</button><button class="btn secondary" data-tab="claims">Certificate Claims</button><button class="btn secondary" data-tab="certificates">Certificates</button></div>
<section id="students" class="panel card"><h2>Students</h2><div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Manage</th></tr></thead><tbody id="studentsBody"></tbody></table></div></section>
<section id="enrollments" class="panel card hidden"><h2>Enrollments</h2><div class="scroll"><table><thead><tr><th>Student</th><th>Course</th><th>Status</th><th>Action</th></tr></thead><tbody id="enrollBody"></tbody></table></div></section>
<section id="claims" class="panel card hidden"><h2>Certificate Claims</h2><div class="scroll"><table><thead><tr><th>ID</th><th>Student</th><th>Status</th><th>Action</th></tr></thead><tbody id="claimsBody"></tbody></table></div></section>
<section id="certificates" class="panel card hidden"><div class="actions" style="justify-content:space-between;align-items:center"><h2>Certificates</h2><button class="btn" onclick="issueCertificateForm()">+ Issue Certificate</button></div><div class="scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Linked student</th></tr></thead><tbody id="certBody"></tbody></table></div></section></main>
<div id="modalbg" class="modalbg hidden"><div class="modal"><button id="close" class="btn secondary">Close</button><div id="modal"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const db=supabase.createClient("https://zsmmmljgguycrvyrmakl.supabase.co","sb_publishable_PEDwhSNvOky8CIP79ihA4Q_ozLI2CnM"),S={u:null,p:[],c:[],e:[],cert:[],claims:[]},$=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function note(t,e=false){$("msg").textContent=t;$("msg").className="status"+(e?" error":"");setTimeout(()=>$("msg").classList.add("hidden"),4000)}function open(h){$("modal").innerHTML=h;$("modalbg").classList.remove("hidden");document.body.style.overflow="hidden"}function close(){$("modalbg").classList.add("hidden");$("modal").innerHTML="";document.body.style.overflow=""}$("close").onclick=close;$("modalbg").addEventListener("click",e=>{if(e.target===$("modalbg"))close()});
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".panel").forEach(p=>p.classList.add("hidden"));$(b.dataset.tab).classList.remove("hidden")});
async function admin(u){let{data:p}=await db.from("profiles").select("*").eq("id",u.id).maybeSingle();if(!p||p.role!=="admin"){await db.auth.signOut();$("loginMsg").textContent="Access denied. This account is not an administrator.";$("loginMsg").className="status error";return}S.u=u;$("adminName").textContent=p.full_name||p.email||u.email;$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}
$("loginForm").onsubmit=async e=>{e.preventDefault();let{data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("loginMsg").textContent=error.message;$("loginMsg").className="status error";return}admin(data.user)};$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
async function load(){let [p,c,e,cert,claims]=await Promise.all([db.from("profiles").select("*"),db.from("courses").select("*"),db.from("enrollments").select("*"),db.from("certificates").select("*"),db.from("certificate_claims").select("*")]);S.p=p.data||[];S.c=c.data||[];S.e=e.data||[];S.cert=cert.data||[];S.claims=claims.data||[];render()}
function name(id){let x=S.p.find(v=>v.id===id);return x?.full_name||x?.email||id}function course(id){let x=S.c.find(v=>String(v.id)===String(id));return x?.title_en||x?.title||x?.slug||id}
function render(){$("studentsBody").innerHTML=S.p.map(x=>`<tr><td>${esc(x.full_name||"—")}</td><td>${esc(x.email||"—")}</td><td>${esc(x.role||"student")}</td><td><button class="btn" onclick="manage('${x.id}')">Manage courses</button></td></tr>`).join("");
$("enrollBody").innerHTML=S.e.map(x=>`<tr><td>${esc(name(x.student_id))}</td><td>${esc(course(x.course_id))}</td><td>${esc(x.status||"active")}</td><td><button class="btn danger" onclick="removeE('${x.id}')">Remove</button></td></tr>`).join("");
$("claimsBody").innerHTML=S.claims.map(x=>`<tr><td>${esc(x.certificate_id)}</td><td>${esc(name(x.student_id))}</td><td>${esc(x.status)}</td><td>${x.status==="pending"?`<button class="btn" onclick="claim('${x.id}','approved')">Approve</button> <button class="btn danger" onclick="claim('${x.id}','rejected')">Reject</button>`:"Reviewed"}</td></tr>`).join("");
$("certBody").innerHTML=S.cert.map(x=>`<tr><td>${esc(x.certificate_id)}</td><td>${esc(x.public_name||"—")}</td><td>${esc(x.course_title||"—")}</td><td>${esc(x.student_id?name(x.student_id):"Not linked")}</td></tr>`).join("")}
window.manage=id=>{let en=S.e.filter(x=>x.student_id===id),avail=S.c.filter(c=>!en.some(e=>String(e.course_id)===String(c.id)));open(`<h2>${esc(name(id))}</h2><h3>Current courses</h3>${en.map(e=>`<p>${esc(course(e.course_id))} <button class="btn danger" onclick="removeE('${e.id}')">Remove</button></p>`).join("")||"<p>No enrollments.</p>"}<h3>Add course</h3><select id="course" class="input"><option value="">Choose course</option>${avail.map(c=>`<option value="${c.id}">${esc(course(c.id))}</option>`).join("")}</select><button class="btn" style="margin-top:10px" onclick="addE('${id}')">Enroll Student</button>`)};
window.addE=async id=>{let cid=$("course").value;if(!cid)return;let{error}=await db.from("enrollments").insert({student_id:id,course_id:cid,status:"active"});if(error)return note(error.message,true);close();await load();note("Student enrolled successfully.")};window.removeE=async id=>{if(!confirm("Remove enrollment?"))return;let{error}=await db.from("enrollments").delete().eq("id",id);if(error)return note(error.message,true);close();await load();note("Enrollment removed.")};
window.claim=async(id,status)=>{let x=S.claims.find(v=>v.id===id);if(status==="approved"){let{data:c}=await db.from("certificates").select("student_id").eq("certificate_id",x.certificate_id).maybeSingle();if(!c)return note("Certificate does not exist.",true);if(c.student_id&&c.student_id!==x.student_id)return note("Certificate already linked to another student.",true);let{error}=await db.from("certificates").update({student_id:x.student_id}).eq("certificate_id",x.certificate_id);if(error)return note(error.message,true)}let{error}=await db.from("certificate_claims").update({status}).eq("id",id);if(error)return note(error.message,true);await load();note("Claim "+status+".")};

window.issueCertificateForm=()=>{const students=S.p.filter(x=>x.role==="student");open(`<h2>Issue Certificate</h2><p><b>Student</b></p><select id="issueStudent" class="input"><option value="">Choose student</option>${students.map(s=>`<option value="${s.id}">${esc(s.full_name||s.email)}</option>`).join("")}</select><p><b>Course</b></p><select id="issueCourse" class="input"><option value="">Choose course</option>${S.c.map(c=>`<option value="${c.id}">${esc(c.title_en||c.title||c.slug||c.id)}</option>`).join("")}</select><p><b>Public name on certificate</b></p><input id="issueName" class="input" placeholder="Student name"><p><b>Hours</b></p><input id="issueHours" class="input" type="number" min="1" value="30"><p><b>Training start date</b></p><input id="issueStart" class="input" type="date"><p><b>Training end date</b></p><input id="issueEnd" class="input" type="date"><p><b>Issue date</b></p><input id="issueDate" class="input" type="date" value="${new Date().toISOString().slice(0,10)}"><p><b>Certificate ID</b></p><input id="issueCertId" class="input" placeholder="Example: NABD-MT-2026-0058"><button class="btn" style="margin-top:14px;width:100%" onclick="createCertificate()">Issue & Generate Certificate</button>`);setTimeout(()=>{const sel=$("issueStudent");if(sel)sel.onchange=()=>{const s=S.p.find(x=>x.id===sel.value);if(s&&$("issueName"))$("issueName").value=s.full_name||""}},0)};

function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
function fitText(ctx,text,maxWidth,startSize,minSize=20){let size=startSize;do{ctx.font=`700 ${size}px Arial`;if(ctx.measureText(text).width<=maxWidth)return size;size-=2}while(size>=minSize);return minSize}
async function makeQR(text){const box=document.createElement("div");box.style.position="fixed";box.style.left="-9999px";document.body.appendChild(box);new QRCode(box,{text,width:220,height:220,correctLevel:QRCode.CorrectLevel.H});await new Promise(r=>setTimeout(r,120));const img=box.querySelector("img"),can=box.querySelector("canvas");let src=img?.src||can?.toDataURL("image/png");box.remove();return loadImage(src)}
function fmtDate(v){if(!v)return "—";const [y,m,d]=v.split("-");return `${d}/${m}/${y}`}
async function generateCertificate(d){
  const tpl=await loadImage("assets/certificates/certificate-template.png?v="+Date.now());
  const c=document.createElement("canvas");c.width=tpl.naturalWidth;c.height=tpl.naturalHeight;
  const x=c.getContext("2d");x.drawImage(tpl,0,0,c.width,c.height);
  const W=c.width,H=c.height,sx=W/1536,sy=H/1024;
  x.textAlign="center";x.textBaseline="middle";

  // Recipient name: first blank line under "This is to certify that"
  x.fillStyle="#102f4b";
  let fs=fitText(x,d.publicName,790*sx,34*sx,19*sx);
  x.font=`700 ${fs}px Georgia`;
  x.fillText(d.publicName,768*sx,334*sy);

  // Course title: centered inside the gold course banner
  fs=fitText(x,d.courseTitle,430*sx,25*sx,15*sx);
  x.font=`700 ${fs}px Georgia`;
  x.fillText(d.courseTitle,650*sx,478*sy);

  // Dates and hours: their dedicated bottom fields
  x.fillStyle="#18384f";x.font=`600 ${17*sx}px Arial`;
  x.textAlign="left";x.fillText(fmtDate(d.startDate),430*sx,758*sy);
  x.fillText(fmtDate(d.endDate),750*sx,758*sy);
  x.textAlign="center";x.font=`700 ${18*sx}px Arial`;
  x.fillText(`${d.hours} Hours`,1090*sx,758*sy);

  // Certificate ID: directly above the verification box
  x.font=`700 ${12*sx}px Arial`;
  x.fillText(d.certificateId,1375*sx,918*sy);

  // QR: replace the decorative QR area at lower-right
  const verify=`https://nabdacademy-arch.github.io/nabd-academy-2023/?cert=${encodeURIComponent(d.certificateId)}#verify`;
  const qr=await makeQR(verify),qs=104*sx;
  x.fillStyle="#fff";x.fillRect(1318*sx,775*sy,116*sx,116*sy);
  x.drawImage(qr,1324*sx,781*sy,qs,qs);
  return c
}
function showGenerated(canvas,id){const url=canvas.toDataURL("image/png");open(`<h2>Certificate Generated</h2><p><b>${esc(id)}</b></p><img class="cert-preview" src="${url}" alt="Generated certificate"><div class="actions" style="margin-top:12px"><button id="downloadCert" class="btn">Download PNG</button><button id="doneCert" class="btn secondary" type="button">Done</button></div>`);setTimeout(()=>{$("downloadCert").onclick=()=>{const a=document.createElement("a");a.href=url;a.download=id+".png";a.click()};$("doneCert").onclick=close},0)}
window.createCertificate=async()=>{const studentId=$("issueStudent").value,courseId=$("issueCourse").value,publicName=$("issueName").value.trim(),hours=parseInt($("issueHours").value,10),startDate=$("issueStart").value,endDate=$("issueEnd").value,issueDate=$("issueDate").value,certificateId=$("issueCertId").value.trim().toUpperCase();if(!studentId||!courseId||!publicName||!hours||!startDate||!endDate||!issueDate||!certificateId)return note("Complete all certificate fields.",true);if(!/^NABD-[A-Z0-9-]+$/.test(certificateId))return note("Certificate ID must start with NABD-.",true);if(startDate>endDate)return note("Training start date must be before end date.",true);const cr=S.c.find(x=>String(x.id)===String(courseId)),courseTitle=cr?.title_en||cr?.title||cr?.slug||"Course";const{data:existing,error:checkError}=await db.from("certificates").select("certificate_id").eq("certificate_id",certificateId).maybeSingle();if(checkError)return note(checkError.message,true);if(existing)return note("This Certificate ID already exists.",true);let canvas;try{canvas=await generateCertificate({publicName,courseTitle,hours,startDate,endDate,issueDate,certificateId})}catch(e){return note("Could not generate certificate. Check certificate-template.png.",true)}const{error}=await db.from("certificates").insert({certificate_id:certificateId,student_id:studentId,course_id:courseId,course_title:courseTitle,hours,issue_date:issueDate,status:"valid",public_name:publicName});if(error)return note(error.message,true);await load();note("Certificate issued and linked to the student successfully.");showGenerated(canvas,certificateId)};
(async()=>{let{data}=await db.auth.getSession();if(data.session)admin(data.session.user)})();</script></body></html>
